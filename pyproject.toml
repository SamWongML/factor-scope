[project]
name = "factor-scope"
version = "0.1.0"
description = "factor-scope — a local-first, nightly-batch decision-support engine for an A-share / funds portfolio."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
# Live data + real LLM providers are opt-in so the core installs and tests run offline.
live = [
    "akshare",
    "baostock",
    "edgartools",
    "fredapi",
    "httpx",
    "mootdx",
]
store = [
    "duckdb>=0.10",
    "pyarrow>=15",
    "ladybug>=0.17,<0.18",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
factor-scope = "factor_scope.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factor_scope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, pure-function tests (no IO, no network)",
    "integration: tests that touch the local store / fixtures on disk",
    "system: end-to-end runs of the `factor-scope run` entrypoint over fixtures",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's documented idiom is to call Option()/Argument() in parameter defaults.
"factor_scope/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

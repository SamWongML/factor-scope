[project]
name = "factor-scope"
version = "0.1.0"
description = "factor-scope — a local-first, nightly-batch decision-support engine for an A-share / funds portfolio."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
# Online-by-default: live data + real providers are the normal path, so these are first-class
# and pinned with compatible bounds (lower = the locked floor, upper = next major) for a
# reproducible nightly. The whole suite still runs offline on fixtures (see tests/conftest.py).
live = [
    "akshare>=1.18,<2",
    "baostock>=0.9,<1",
    # Promoted from a transitive AkShare dep to an explicit member: the EastMoney K-line client
    # impersonates a real Chrome TLS/HTTP fingerprint through it to defeat the push2his reset.
    "curl_cffi>=0.15,<1",
    "edgartools>=5.35,<6",
    "fredapi>=0.5,<1",
    "httpx>=0.27,<1",
    "mootdx>=0.9,<1",
]
store = [
    "duckdb>=1,<2",
    "pyarrow>=15,<25",
    "ladybug>=0.17,<0.18",
]
# Theme discovery — the host-only research engine (a Mac mini, no paid API for the topic model).
# Online BERTopic drives the quantitative trajectory (jieba segments the Chinese corpus); the LLM
# judgment is stratified into a cheap draft + a strong judge tier over pydantic-ai-slim[openai] —
# one extra covers DeepSeek/Qwen/GLM/Kimi via OpenAI-compatible endpoints. Imported lazily inside the
# engines only, so the test mode (which installs just .[dev,store]) never loads them and stays
# byte-for-byte deterministic on the fakes.
discovery = [
    "bertopic>=0.16,<0.17",
    "sentence-transformers>=3,<6",
    "scikit-learn>=1.4,<2",
    "jieba>=0.42,<1",
    "pydantic-ai-slim[openai]>=1,<2",
]
# The read-only history API a frontend consumes (factor_scope/serve.py). Imported lazily inside
# `create_app` / the `serve` command only, so the offline suite never starts a web stack.
serve = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
dev = [
    "pytest>=8",
    "ruff>=0.4",
    "mypy>=1.9",
    "httpx>=0.27,<1",  # fastapi.testclient's transport — exercises the serve extra in-suite
]

[project.scripts]
factor-scope = "factor_scope.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factor_scope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, pure-function tests (no IO, no network)",
    "integration: tests that touch the local store / fixtures on disk",
    "system: end-to-end runs of the `factor-scope run` entrypoint over fixtures",
    "perf: scalability guardrails — a multi-year synthetic history asserting bounded store growth and flat serving work (offline, deterministic)",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer's documented idiom is to call Option()/Argument() in parameter defaults.
"factor_scope/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Pin Python 3.11
        run: uv python install 3.11

      - name: Sync project (+dev, +store) into a uv venv
        run: uv sync --extra dev --extra store --python 3.11

      - name: Lint + type-check + test (offline — no live sources, no paid LLMs)
        run: make check
